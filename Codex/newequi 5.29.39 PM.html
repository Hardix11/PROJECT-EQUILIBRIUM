<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0E1A" />
    <title>HORIZON'26 - Project Equilibrium</title>
    <script type="module" src="https://unpkg.com/@splinetool/viewer/build/spline-viewer.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap");

      :root {
        color-scheme: dark;
        --background: #0A0E1A;
        --ink: #F7FAFF;
        --muted: rgba(247, 250, 255, 0.62);
        --blue: #7C9EE8;
        --amber: #E8A97C;
        --mint: #7CE8C4;
        --line: rgba(247, 250, 255, 0.15);
      }

      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      html,
      body,
      #site {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background:
          radial-gradient(circle at 20% 15%, rgba(124, 158, 232, 0.18) 0, transparent 34%),
          linear-gradient(180deg, #0A0E1A 0%, #03050A 100%);
        color: var(--ink);
        font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: background 0.3s ease;
      }

      button,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--mint);
        outline-offset: 4px;
      }

      .site-shell {
        position: relative;
        width: 100%;
        height: 100svh;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(circle at 50% 46%, var(--mood-glow, rgba(124, 158, 232, 0.12)) 0, transparent 38%),
          radial-gradient(circle at 24% 18%, rgba(124, 158, 232, 0.16) 0, transparent 34%),
          radial-gradient(circle at 78% 78%, rgba(124, 232, 196, 0.08) 0, transparent 36%),
          linear-gradient(180deg, rgba(10, 14, 26, 0.82), rgba(3, 5, 10, 0.95));
      }

      .spline-background,
      .spline-overlay,
      .ambient-field,
      .dot-texture {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .spline-background {
        z-index: 0;
        overflow: hidden;
      }

      .spline-stage {
        display: block;
        width: 100%;
        height: 100%;
        opacity: 0.94;
        transform: scale(1.14);
        transform-origin: center;
        filter: saturate(0.9) brightness(0.78);
        pointer-events: none;
      }

      .spline-overlay {
        z-index: 1;
        background:
          radial-gradient(circle at 50% 42%, rgba(124, 158, 232, 0.15) 0, rgba(10, 14, 26, 0.2) 34%, rgba(10, 14, 26, 0.8) 76%),
          linear-gradient(180deg, rgba(10, 14, 26, 0.36), rgba(3, 5, 10, 0.76));
      }

      .ambient-field {
        z-index: 2;
        overflow: hidden;
      }

      .dot-texture {
        opacity: 0.23;
        background-image: radial-gradient(rgba(247, 250, 255, 0.32) 0.8px, transparent 0.8px);
        background-size: 24px 24px;
        mask-image: radial-gradient(circle at center, black 0, transparent 76%);
      }

      .ambient-blob {
        position: absolute;
        top: 44%;
        left: 50%;
        width: min(58vmin, 620px);
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border-radius: 46% 54% 56% 44% / 44% 45% 55% 56%;
        background:
          radial-gradient(circle at 32% 26%, rgba(124, 232, 196, 0.18), transparent 28%),
          radial-gradient(circle at 68% 62%, rgba(232, 169, 124, 0.14), transparent 34%),
          radial-gradient(circle at center, rgba(124, 158, 232, 0.24), transparent 62%);
        filter: blur(3px);
        opacity: 0.76;
      }

      .meditation-scene {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        perspective: 900px;
        opacity: 0.72;
        transform-style: preserve-3d;
      }

      .meditation-stage {
        position: relative;
        width: min(78vmin, 720px);
        aspect-ratio: 1;
        transform:
          rotateX(62deg)
          rotateZ(var(--scene-tilt-x, -9deg))
          translateY(12%)
          translateZ(-100px);
        transform-style: preserve-3d;
      }

      .zen-platform {
        position: absolute;
        inset: 17%;
        border: 1px solid rgba(247, 250, 255, 0.11);
        border-radius: 50%;
        background:
          radial-gradient(circle, rgba(124, 158, 232, 0.12), transparent 58%),
          conic-gradient(from 30deg, rgba(124, 232, 196, 0.02), rgba(124, 158, 232, 0.14), rgba(232, 169, 124, 0.08), rgba(124, 232, 196, 0.02));
        box-shadow:
          0 0 90px rgba(124, 158, 232, 0.18),
          inset 0 0 70px rgba(247, 250, 255, 0.035);
      }

      .zen-ring {
        position: absolute;
        inset: var(--ring-inset);
        border: 1px solid rgba(247, 250, 255, 0.08);
        border-radius: 50%;
        transform: translateZ(var(--ring-depth));
        box-shadow: 0 0 34px rgba(124, 158, 232, 0.12);
      }

      .meditator {
        position: absolute;
        left: 50%;
        top: 44%;
        width: 140px;
        height: 190px;
        transform:
          translate(-50%, -50%)
          rotateX(-62deg)
          translateZ(82px)
          rotateY(var(--scene-tilt-y, 9deg));
        transform-style: preserve-3d;
        filter: drop-shadow(0 34px 28px rgba(0, 0, 0, 0.38));
      }

      .meditator .halo,
      .meditator .halo::before,
      .meditator .halo::after {
        position: absolute;
        content: "";
        left: 50%;
        top: 36%;
        border: 1px solid rgba(124, 232, 196, 0.18);
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }

      .meditator .halo {
        width: 210px;
        height: 210px;
        box-shadow: 0 0 80px rgba(124, 158, 232, 0.18);
      }

      .meditator .halo::before {
        width: 150px;
        height: 150px;
      }

      .meditator .halo::after {
        width: 82px;
        height: 82px;
      }

      .head,
      .torso,
      .arm,
      .leg {
        position: absolute;
        left: 50%;
        background:
          linear-gradient(135deg, rgba(247, 250, 255, 0.9), rgba(124, 158, 232, 0.36)),
          rgba(124, 158, 232, 0.4);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.42),
          0 0 30px rgba(124, 158, 232, 0.28);
      }

      .head {
        top: 16px;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        transform: translateX(-50%) translateZ(42px);
      }

      .torso {
        top: 70px;
        width: 76px;
        height: 88px;
        border-radius: 46% 46% 42% 42%;
        transform: translateX(-50%) translateZ(24px);
      }

      .arm {
        top: 116px;
        width: 76px;
        height: 22px;
        border-radius: 999px;
        transform-origin: center;
      }

      .arm.left {
        transform: translateX(-82px) rotateZ(22deg) translateZ(22px);
      }

      .arm.right {
        transform: translateX(6px) rotateZ(-22deg) translateZ(22px);
      }

      .leg {
        top: 150px;
        width: 96px;
        height: 28px;
        border-radius: 999px;
      }

      .leg.left {
        transform: translateX(-96px) rotateZ(-14deg) translateZ(12px);
      }

      .leg.right {
        transform: translateX(0) rotateZ(14deg) translateZ(12px);
      }

      .cursor-aura,
      .cursor-dot {
        position: fixed;
        left: 0;
        top: 0;
        pointer-events: none;
        z-index: 10;
        transform: translate3d(-50%, -50%, 0);
        mix-blend-mode: screen;
      }

      .cursor-aura {
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--cursor-glow, rgba(124, 158, 232, 0.14)) 0, transparent 68%);
        filter: blur(8px);
        opacity: 0.72;
      }

      .cursor-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: rgba(247, 250, 255, 0.94);
        box-shadow: 0 0 18px var(--cursor-glow, rgba(124, 158, 232, 0.55));
      }

      .topbar {
        position: fixed;
        z-index: 5;
        top: 16px;
        left: max(16px, env(safe-area-inset-left));
        right: max(16px, env(safe-area-inset-right));
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 18px;
        border: 1px solid rgba(247, 250, 255, 0.11);
        border-radius: 8px;
        background: rgba(10, 14, 26, 0.52);
        backdrop-filter: blur(18px);
        box-shadow: 0 18px 70px rgba(0, 0, 0, 0.22);
      }

      .brand {
        color: rgba(247, 250, 255, 0.88);
        font-size: 14px;
        font-weight: 700;
      }

      .phase-dots {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .phase-dot {
        width: 7px;
        height: 7px;
        border: 1px solid rgba(247, 250, 255, 0.5);
        border-radius: 999px;
      }

      .phase-dot.is-active {
        border-color: rgba(247, 250, 255, 0.94);
        background: rgba(247, 250, 255, 0.94);
        box-shadow: 0 0 14px rgba(124, 232, 196, 0.46);
      }

      .phase-viewport {
        position: relative;
        z-index: 3;
        height: 100svh;
      }

      .phase-frame,
      .phase {
        height: 100%;
      }

      .phase {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 92px 24px 32px;
        overflow: hidden;
      }

      .landing-stack {
        display: grid;
        justify-items: center;
        gap: 34px;
        text-align: center;
      }

      .guide-feature-row {
        width: min(760px, calc(100vw - 48px));
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .guide-feature {
        min-height: 88px;
        display: grid;
        align-content: center;
        gap: 7px;
        padding: 14px;
        border: 1px solid rgba(247, 250, 255, 0.12);
        border-radius: 8px;
        background: rgba(247, 250, 255, 0.055);
        backdrop-filter: blur(18px);
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.18);
      }

      .guide-feature b {
        color: rgba(247, 250, 255, 0.9);
        font-size: 13px;
      }

      .guide-feature span {
        color: rgba(247, 250, 255, 0.5);
        font-size: 11px;
        line-height: 1.35;
      }

      .idle-title,
      .phase-title,
      .breath-label,
      .results-title {
        margin: 0;
        font-family: "DM Serif Display", Georgia, serif;
        font-weight: 400;
        line-height: 0.98;
      }

      .idle-title {
        max-width: 720px;
        font-size: 76px;
        text-shadow: 0 20px 80px rgba(124, 158, 232, 0.26);
      }

      .phase-title {
        max-width: 820px;
        color: rgba(247, 250, 255, 0.94);
        font-size: 48px;
        text-align: center;
      }

      .primary-button,
      .secondary-button,
      .skip-button,
      .drawer-toggle {
        min-height: 46px;
        border: 1px solid rgba(247, 250, 255, 0.16);
        color: var(--ink);
        background: rgba(247, 250, 255, 0.09);
        backdrop-filter: blur(18px);
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.22);
        transition:
          transform 0.25s ease,
          border-color 0.25s ease,
          background 0.25s ease,
          box-shadow 0.25s ease;
      }

      .primary-button,
      .secondary-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-width: 174px;
        padding: 0 22px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 700;
      }

      .primary-button {
        border-color: rgba(124, 158, 232, 0.52);
        background:
          linear-gradient(135deg, rgba(124, 158, 232, 0.34), rgba(124, 232, 196, 0.18)),
          rgba(247, 250, 255, 0.08);
      }

      .large-button {
        min-height: 54px;
        min-width: 198px;
      }

      .primary-button:hover,
      .secondary-button:hover,
      .skip-button:hover,
      .drawer-toggle:hover {
        transform: translateY(-2px);
        border-color: rgba(247, 250, 255, 0.32);
        background-color: rgba(247, 250, 255, 0.13);
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.28);
      }

      .breathing-phase {
        gap: 14px;
      }

      .breath-stage {
        position: relative;
        width: min(74vmin, 430px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
      }

      .progress-ring,
      .breath-blob-wrap {
        position: absolute;
        inset: 0;
      }

      .progress-ring {
        overflow: visible;
        transform: rotate(-90deg);
      }

      .progress-track,
      .progress-arc {
        fill: none;
        stroke-width: 2.5;
      }

      .progress-track {
        stroke: rgba(247, 250, 255, 0.1);
      }

      .progress-arc {
        stroke: var(--mint);
        stroke-linecap: round;
        filter: drop-shadow(0 0 12px rgba(124, 232, 196, 0.52));
        transition: stroke-dashoffset 0.25s linear;
      }

      .breath-blob-wrap {
        display: grid;
        place-items: center;
        transform: scale(1);
        transform-origin: center;
      }

      .breath-blob-svg {
        width: 54%;
        height: 54%;
        overflow: visible;
        color: var(--blue);
        filter: drop-shadow(0 0 32px rgba(124, 158, 232, 0.46));
      }

      .breath-blob-core {
        fill: currentColor;
        opacity: 0.82;
      }

      .breath-blob-shimmer {
        fill: none;
        stroke: rgba(247, 250, 255, 0.68);
        stroke-width: 1.4;
        opacity: 0;
      }

      .breath-label {
        min-height: 58px;
        color: rgba(247, 250, 255, 0.92);
        font-size: 52px;
        text-align: center;
      }

      .breath-timer {
        color: var(--muted);
        font-size: 16px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .breath-guide-strip {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: rgba(247, 250, 255, 0.56);
        font-size: 12px;
        font-weight: 700;
      }

      .guide-pill {
        min-height: 30px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 0 11px;
        border: 1px solid rgba(247, 250, 255, 0.12);
        border-radius: 999px;
        background: rgba(247, 250, 255, 0.06);
        backdrop-filter: blur(14px);
      }

      .skip-button {
        position: fixed;
        right: max(24px, env(safe-area-inset-right));
        bottom: max(24px, env(safe-area-inset-bottom));
        min-width: 88px;
        padding: 0 18px;
        border-radius: 999px;
      }

      .mood-phase {
        gap: 18px;
      }

      .mood-grid {
        position: relative;
        width: min(400px, 80vmin);
        max-width: calc(100vw - 48px);
        aspect-ratio: 1;
        border: 1px solid rgba(247, 250, 255, 0.14);
        border-radius: 8px;
        background:
          linear-gradient(90deg, rgba(124, 158, 232, 0.18), rgba(232, 169, 124, 0.14)),
          rgba(247, 250, 255, 0.05);
        box-shadow:
          inset 0 0 40px rgba(247, 250, 255, 0.03),
          0 28px 90px rgba(0, 0, 0, 0.26);
        backdrop-filter: blur(22px);
        touch-action: none;
      }

      .crosshair {
        position: absolute;
        background: rgba(247, 250, 255, 0.15);
      }

      .crosshair.horizontal {
        left: 0;
        right: 0;
        top: 50%;
        height: 0.5px;
      }

      .crosshair.vertical {
        top: 0;
        bottom: 0;
        left: 50%;
        width: 0.5px;
      }

      .quadrant-label {
        position: absolute;
        color: rgba(247, 250, 255, 0.52);
        font-size: 12px;
        font-weight: 700;
        font-variant-caps: all-small-caps;
        pointer-events: none;
      }

      .quadrant-label.top {
        top: 14px;
      }

      .quadrant-label.bottom {
        bottom: 14px;
      }

      .quadrant-label.left {
        left: 16px;
      }

      .quadrant-label.right {
        right: 16px;
      }

      .mood-marker {
        position: absolute;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 2px solid rgba(255, 255, 255, 0.78);
        border-radius: 999px;
        background: #ffffff;
        box-shadow:
          0 0 0 9px rgba(255, 255, 255, 0.08),
          0 0 30px rgba(255, 255, 255, 0.72);
        transform: translate(-50%, -50%);
      }

      .mood-readout {
        min-height: 22px;
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }

      .mood-insight {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        border: 1px solid rgba(247, 250, 255, 0.12);
        border-radius: 999px;
        background: rgba(247, 250, 255, 0.06);
        color: rgba(247, 250, 255, 0.76);
        backdrop-filter: blur(18px);
        font-size: 13px;
        font-weight: 700;
      }

      .mood-swatch {
        width: 16px;
        height: 16px;
        border-radius: 999px;
        background: var(--blue);
        box-shadow: 0 0 18px currentColor;
      }

      .capture-slot {
        min-height: 48px;
        display: grid;
        place-items: center;
      }

      .capture-slot .primary-button {
        opacity: 0;
        pointer-events: none;
        transform: translateY(5px);
      }

      .capture-slot[data-visible="true"] .primary-button {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .journal-phase {
        gap: 26px;
      }

      .journal-field {
        position: relative;
        width: min(900px, calc(100vw - 48px));
        height: min(42vh, 360px);
        min-height: 210px;
        border: 1px solid rgba(247, 250, 255, 0.12);
        border-radius: 8px;
        background: rgba(247, 250, 255, 0.07);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(22px);
      }

      .journal-textarea {
        width: 100%;
        height: 100%;
        padding: 28px 28px 52px;
        border: 0;
        border-radius: 8px;
        resize: none;
        color: rgba(247, 250, 255, 0.94);
        background: transparent;
        font-family: "DM Serif Display", Georgia, serif;
        font-size: 20px;
        line-height: 1.55;
      }

      .char-counter {
        position: absolute;
        right: 22px;
        bottom: 18px;
        color: rgba(247, 250, 255, 0.54);
        font-size: 13px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        transition: color 0.25s ease;
      }

      .char-counter.near-limit {
        color: var(--amber);
      }

      .journal-insight {
        width: min(900px, calc(100vw - 48px));
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        color: rgba(247, 250, 255, 0.56);
        font-size: 12px;
        font-weight: 700;
      }

      .sentiment-meter {
        min-height: 32px;
        display: inline-flex;
        align-items: center;
        padding: 0 12px;
        border: 1px solid rgba(247, 250, 255, 0.12);
        border-radius: 999px;
        background: rgba(247, 250, 255, 0.055);
        backdrop-filter: blur(14px);
      }

      .journal-field.sentiment-positive {
        border-color: rgba(124, 232, 196, 0.48);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.28), 0 0 34px rgba(124, 232, 196, 0.12);
      }

      .journal-field.sentiment-negative {
        border-color: rgba(232, 169, 124, 0.5);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.28), 0 0 34px rgba(232, 169, 124, 0.14);
      }

      .results-phase {
        gap: 18px;
      }

      .results-layout {
        width: min(880px, calc(100vw - 48px));
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        align-items: center;
        gap: 28px;
      }

      .results-copy {
        display: grid;
        gap: 18px;
        justify-items: start;
      }

      .results-title {
        max-width: 520px;
        font-size: 54px;
      }

      .streak-counter {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid rgba(124, 232, 196, 0.28);
        border-radius: 999px;
        color: rgba(247, 250, 255, 0.9);
        background: rgba(124, 232, 196, 0.09);
        font-size: 16px;
        font-weight: 700;
      }

      .chart-shell {
        position: relative;
        width: 340px;
        height: 340px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(247, 250, 255, 0.12);
        border-radius: 8px;
        background: rgba(247, 250, 255, 0.065);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.26);
        backdrop-filter: blur(22px);
      }

      .scatter-svg {
        width: 320px;
        height: 320px;
        overflow: visible;
      }

      .scatter-plane {
        fill: rgba(247, 250, 255, 0.045);
        stroke: rgba(247, 250, 255, 0.12);
      }

      .scatter-crosshair {
        stroke: rgba(247, 250, 255, 0.15);
        stroke-width: 0.5;
      }

      .scatter-label {
        fill: rgba(247, 250, 255, 0.55);
        font-family: "DM Sans", system-ui, sans-serif;
        font-size: 11px;
        font-weight: 700;
        font-variant-caps: all-small-caps;
      }

      .drift-trail {
        fill: none;
        stroke: rgba(247, 250, 255, 0.5);
        stroke-width: 1.2;
      }

      .scatter-node {
        opacity: 0;
      }

      .scatter-point {
        filter: drop-shadow(0 0 10px rgba(247, 250, 255, 0.28));
      }

      .today-ring {
        fill: none;

  <body>
    <div id="site"></div>
    <script>
      const STORAGE_KEY = "equilibrium_sessions";
      const phases = [
        { id: "IDLE", duration: null },
        { id: "BREATHING", duration: 120000 },
        { id: "MOOD", duration: null },
        { id: "JOURNAL", duration: null },
        { id: "RESULTS", duration: null },
      ];
      const phaseScheduler = {
        phases,
        get(currentId) {
          return this.phases.find((phase) => phase.id === currentId);
        },
        next(currentId) {
          const currentIndex = this.phases.findIndex((phase) => phase.id === currentId);
          const nextIndex = Math.min(currentIndex + 1, this.phases.length - 1);
          return this.phases[nextIndex] ? this.phases[nextIndex].id : currentId;
        },
      };
      const breathConfig = { inhale: 4, hold: 2, exhale: 6 };
      const baseBodyBackground =
        "radial-gradient(circle at 20% 15%, rgba(124, 158, 232, 0.18) 0, transparent 34%), linear-gradient(180deg, #0A0E1A 0%, #03050A 100%)";
      const site = document.getElementById("site");
      const progressCircumference = 2 * Math.PI * 190;
      let phaseTimer = null;
      let breathTimer = null;
      let lastBreathLabel = "";
      let audioContext = null;
      let oscillator = null;
      let gainNode = null;
      const positiveWords = ["calm", "hope", "safe", "steady", "grateful", "peace", "better", "light", "clear", "ready"];
      const negativeWords = ["stress", "anxious", "afraid", "tired", "angry", "heavy", "overwhelmed", "sad", "panic", "stuck"];
      const state = {
        currentPhase: "IDLE",
        phaseStartedAt: Date.now(),
        mood: createDefaultMood(),
        journal: "",
        sessions: loadSessions(),
        drawerOpen: false,
        cursor: { x: window.innerWidth / 2, y: window.innerHeight / 2, auraX: window.innerWidth / 2, auraY: window.innerHeight / 2 },
        audioReady: false,
        currentBreathTone: "",
      };

      function clamp(value, min = 0, max = 1) {
        return Math.min(Math.max(value, min), max);
      }

      function roundToTwo(value) {
        return Math.round(value * 100) / 100;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function createMoodFromPosition(markerX, markerY, moved = true) {
        const x = clamp(markerX);
        const y = clamp(markerY);
        const valence = roundToTwo(1 - x);
        const arousal = roundToTwo(1 - y);
        const hue = Math.round(200 - x * 160);
        const saturation = Math.round(40 + arousal * 42);
        const lightness = Math.round(58 + valence * 4);

        return {
          markerX: x,
          markerY: y,
          valence,
          arousal,
          moodColor: `hsl(${hue} ${saturation}% ${lightness}%)`,
          moodGlow: `hsla(${hue}, ${saturation}%, ${lightness}%, 0.28)`,
          moved,
        };
      }

      function createDefaultMood() {
        return createMoodFromPosition(0.5, 0.5, false);
      }

      function moodBodyBackground(mood) {
        const glowX = 18 + mood.markerX * 64;
        const glowY = 16 + mood.markerY * 62;
        return `radial-gradient(circle at ${glowX}% ${glowY}%, ${mood.moodGlow} 0, transparent 38%), radial-gradient(circle at 80% 82%, rgba(124, 232, 196, 0.12) 0, transparent 34%), linear-gradient(180deg, #0A0E1A 0%, #03050A 100%)`;
      }

      function loadSessions() {
        try {
          const parsedSessions = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(parsedSessions) ? parsedSessions : [];
        } catch {
          return [];
        }
      }

      function persistSessions(sessions) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
      }

      function countWords(text) {
        const trimmed = text.trim();
        return trimmed ? trimmed.split(/\s+/).length : 0;
      }

      function toLocalDateKey(value) {
        const date = value instanceof Date ? value : new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function calculateStreak(sessions) {
        const sessionDays = new Set(sessions.map((session) => toLocalDateKey(session.date)).filter(Boolean));
        let streak = 0;
        const cursor = new Date();

        while (sessionDays.has(toLocalDateKey(cursor))) {
          streak += 1;
          cursor.setDate(cursor.getDate() - 1);
        }

        return streak;
      }

      function formatClock(milliseconds) {
        const totalSeconds = Math.max(0, Math.ceil(milliseconds / 1000));
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = String(totalSeconds % 60).padStart(2, "0");
        return `${minutes}:${seconds}`;
      }

      function formatSessionDate(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "Recent";
        return new Intl.DateTimeFormat(undefined, {
          weekday: "short",
          month: "short",
          day: "numeric",
        }).format(date);
      }

      function emotionFromMood(mood) {
        if (mood.arousal >= 0.5 && mood.valence >= 0.5) return "Energized";
        if (mood.arousal >= 0.5 && mood.valence < 0.5) return "Activated";
        if (mood.arousal < 0.5 && mood.valence >= 0.5) return "Settled";
        return "Tender";
      }

      function scoreSentiment(text) {
        const words = text.toLowerCase().match(/[a-z']+/g) || [];
        return words.reduce((score, word) => {
          if (positiveWords.includes(word)) return score + 1;
          if (negativeWords.includes(word)) return score - 1;
          return score;
        }, 0);
      }

      function sentimentLabel(score) {
        if (score > 0) return "Tone: restorative";
        if (score < 0) return "Tone: heavy";
        return "Tone: neutral";
      }

      function moodAccentParts(mood) {
        const hueMatch = /hsl\((\d+)/.exec(mood.moodColor);
        const hue = hueMatch ? Number(hueMatch[1]) : 200;
        return {
          glow: `hsla(${hue}, 78%, 66%, 0.22)`,
          strong: `hsla(${hue}, 86%, 68%, 0.62)`,
        };
      }

      function applyAdaptiveTheme(mood) {
        const parts = moodAccentParts(mood);
        document.documentElement.style.setProperty("--cursor-glow", parts.strong);
        document.documentElement.style.setProperty("--mood-glow", parts.glow);
      }

      function beginAudio() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!audioContext) {
          audioContext = new AudioContext();
          oscillator = audioContext.createOscillator();
          gainNode = audioContext.createGain();
          oscillator.type = "sine";
          oscillator.frequency.value = 196;
          gainNode.gain.value = 0;
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          oscillator.start();
        }
        audioContext.resume?.();
        state.audioReady = true;
      }

      function setBreathTone(label) {
        if (!audioContext || !oscillator || !gainNode || !state.audioReady) return;
        const now = audioContext.currentTime;
        const frequency = label === "Inhale" ? 294 : label === "Hold" ? 330 : 220;
        oscillator.frequency.cancelScheduledValues(now);
        oscillator.frequency.setTargetAtTime(frequency, now, 0.55);
        gainNode.gain.cancelScheduledValues(now);
        gainNode.gain.setTargetAtTime(label === "Hold" ? 0.025 : 0.04, now, 0.2);
      }

      function fadeBreathTone() {
        if (!audioContext || !gainNode) return;
        gainNode.gain.setTargetAtTime(0, audioContext.currentTime, 0.2);
      }

      function pulseHaptics(label) {
        if (!("vibrate" in navigator)) return;
        if (label === "Inhale") navigator.vibrate([80, 90, 80]);
        if (label === "Hold") navigator.vibrate([50]);
        if (label === "Exhale") navigator.vibrate([120, 80, 40]);
      }

      function setPhase(phaseId) {
        clearTimers();
        if (state.currentPhase === "BREATHING" && phaseId !== "BREATHING") fadeBreathTone();
        state.currentPhase = phaseId;
        state.phaseStartedAt = Date.now();
        lastBreathLabel = "";
        state.currentBreathTone = "";
        render();
      }

      function advancePhase() {
        setPhase(phaseScheduler.next(state.currentPhase));
      }

      function clearTimers() {
        if (phaseTimer) {
          window.clearTimeout(phaseTimer);
          phaseTimer = null;
        }
        if (breathTimer) {
          window.clearInterval(breathTimer);
          breathTimer = null;
        }
      }

      function render() {
        state.sessions = loadSessions();
        applyAdaptiveTheme(state.mood);
        document.body.style.background =
          state.currentPhase === "MOOD" && state.mood.moved
            ? moodBodyBackground(state.mood)
            : baseBodyBackground;

        site.innerHTML = `
          <div class="site-shell">
            ${backgroundSceneMarkup()}
            <div class="ambient-field" aria-hidden="true">
              <canvas class="particle-canvas" id="particleCanvas"></canvas>
            </div>
            <div class="cursor-aura" data-cursor-aura></div>
            <div class="cursor-dot" data-cursor-dot></div>
            ${headerMarkup()}
            <main class="phase-viewport" aria-live="polite">
              <div class="phase-frame" data-phase="${state.currentPhase}">
                ${phaseMarkup()}
              </div>
            </main>
          </div>
        `;

        wireCurrentPhase();
        positionCursorNodes();
        scheduleTimedPhase();
        initParticleSystem();
      }

      function backgroundSceneMarkup() {
        return `
          <div class="spline-background" aria-hidden="true">
            <spline-viewer
              class="spline-stage"
              url="https://prod.spline.design/pky-E3G4jelIAptK/scene.splinecode"
            ></spline-viewer>
          </div>
          <div class="spline-overlay" aria-hidden="true"></div>
        `;
      }

      function positionCursorNodes() {
        const aura = site.querySelector("[data-cursor-aura]");
        const dot = site.querySelector("[data-cursor-dot]");
        if (!aura || !dot) return;
        aura.style.transform = `translate3d(${state.cursor.auraX - 160}px, ${state.cursor.auraY - 160}px, 0)`;
        dot.style.transform = `translate3d(${state.cursor.x - 4}px, ${state.cursor.y - 4}px, 0)`;
      }

      function animateCursorAura() {
        state.cursor.auraX += (state.cursor.x - state.cursor.auraX) * 0.12;
        state.cursor.auraY += (state.cursor.y - state.cursor.auraY) * 0.12;
        positionCursorNodes();
        requestAnimationFrame(animateCursorAura);
      }

      function headerMarkup() {
        const dots = phases
          .map(
            (phase) =>
              `<span class="phase-dot ${phase.id === state.currentPhase ? "is-active" : ""}" aria-hidden="true"></span>`,
          )
          .join("");

        return `
          <header class="topbar">
            <div class="brand">Project Equilibrium</div>
            <div class="phase-dots" aria-label="${state.currentPhase} phase">${dots}</div>
          </header>
        `;
      }

      function phaseMarkup() {
        if (state.currentPhase === "IDLE") return idleMarkup();
        if (state.currentPhase === "BREATHING") return breathingMarkup();
        if (state.currentPhase === "MOOD") return moodMarkup();
        if (state.currentPhase === "JOURNAL") return journalMarkup();
        return resultsMarkup();
      }

      function idleMarkup() {
        return `
          <section class="phase idle-phase">
            <div class="landing-stack">
              <h1 class="idle-title">Ready to reset?</h1>
              <div class="guide-feature-row" aria-label="Guide feature highlights">
                <div class="guide-feature"><b>Breath Tone</b><span>Native sine audio rises, holds, and falls with the breath.</span></div>
                <div class="guide-feature"><b>Mood Heatmap</b><span>Thirty days of emotional color history at a glance.</span></div>
                <div class="guide-feature"><b>Smart Journal</b><span>Live sentiment tint plus word cloud after sessions.</span></div>
                <div class="guide-feature"><b>Drift Replay</b><span>Scatter path, velocity arrow, and animated session trail.</span></div>
              </div>
              <button class="primary-button large-button" type="button" data-action="begin">Begin Session</button>
            </div>
          </section>
        `;
      }

      function breathingMarkup() {
        return `
          <section class="phase breathing-phase">
            <div class="breath-stage">
              <svg class="progress-ring" viewBox="0 0 430 430" aria-hidden="true">
                <circle class="progress-track" cx="215" cy="215" r="190"></circle>
                <circle class="progress-arc" data-progress cx="215" cy="215" r="190" stroke-dasharray="${progressCircumference}" stroke-dashoffset="0"></circle>
              </svg>
              <div class="breath-blob-wrap" aria-hidden="true">
                <svg class="breath-blob-svg" viewBox="0 0 260 260" role="presentation">
                  <path class="breath-blob-core" d="M128 18C166 18 207 42 225 78C244 117 230 159 204 194C178 230 138 247 98 235C58 223 30 190 22 150C14 111 27 70 58 45C78 29 102 18 128 18Z"></path>
                  <path class="breath-blob-shimmer" d="M128 18C166 18 207 42 225 78C244 117 230 159 204 194C178 230 138 247 98 235C58 223 30 190 22 150C14 111 27 70 58 45C78 29 102 18 128 18Z"></path>
                </svg>
              </div>
            </div>
            <h2 class="breath-label" data-breath-label>Inhale</h2>
            <div class="breath-timer" data-breath-timer aria-label="2:00 remaining">2:00</div>

      }

      function moodMarkup() {
        return `
          <section class="phase mood-phase">
            <h1 class="phase-title">How does this moment feel?</h1>
            <div class="mood-grid" data-mood-grid>
              <div class="crosshair horizontal"></div>
              <div class="crosshair vertical"></div>
              <span class="quadrant-label top left">Excited</span>
              <span class="quadrant-label top right">Anxious</span>
              <span class="quadrant-label bottom left">Calm</span>
              <span class="quadrant-label bottom right">Down</span>
              <button class="mood-marker" type="button" data-mood-marker aria-label="Valence ${state.mood.valence.toFixed(2)}, arousal ${state.mood.arousal.toFixed(2)}"></button>
            </div>

              <span class="mood-swatch" data-mood-swatch></span>

            <div class="capture-slot" data-capture-slot data-visible="${state.mood.moved ? "true" : "false"}">
              <button class="primary-button" type="button" data-action="capture">Capture Mood &rarr;</button>
            </div>
          </section>
        `;
      }

      function adaptiveJournalPrompt(mood) {
        if (!mood.moved) return "Take a moment to write freely about how you feel right now.";
        if (mood.arousal >= 0.7 && mood.valence >= 0.6) return "What is fueling your energy right now? Where do you want to direct it?";
        if (mood.arousal >= 0.7 && mood.valence < 0.4) return "What's driving the intensity you're feeling? Is there something asking for your attention?";
        if (mood.arousal < 0.35 && mood.valence >= 0.6) return "You seem settled. What helped you arrive at this calm?";
        if (mood.arousal < 0.35 && mood.valence < 0.4) return "What's feeling heavy right now? You don't need to fix it — just let it surface.";
        if (mood.arousal >= 0.5 && mood.valence < 0.5) return "Notice what's activated in you. What would help you feel safer in this moment?";
        return "What's present for you right now? Let your thoughts flow without judgment.";
      }

      function journalMarkup() {
        const isNearLimit = state.journal.length > 240;
        const prompt = adaptiveJournalPrompt(state.mood);
        return `
          <section class="phase journal-phase">
            <h1 class="phase-title">What's on your mind?</h1>
            <p class="journal-prompt">${escapeHtml(prompt)}</p>
            <div class="journal-field">
              <textarea class="journal-textarea" data-journal aria-label="Journal entry" spellcheck="true">${escapeHtml(state.journal)}</textarea>
              <span class="char-counter ${isNearLimit ? "near-limit" : ""}" data-counter>${state.journal.length} / 280</span>
            </div>
            <div class="journal-insight">
              <span class="sentiment-meter" data-sentiment>${sentimentLabel(scoreSentiment(state.journal))}</span>
              <span>Journal is stored as a 100-character private excerpt.</span>
            </div>
            <button class="primary-button" type="button" data-action="complete">Complete Session &rarr;</button>
          </section>
        `;
      }

      function calculateDriftVector(sessions) {
        if (sessions.length < 2) return null;
        const recent = sessions.slice(-7);
        if (recent.length < 2) return null;
        const first = recent[0];
        const last = recent[recent.length - 1];
        const dv = Number(last.valence) - Number(first.valence);
        const da = Number(last.arousal) - Number(first.arousal);
        if (Math.abs(dv) < 0.05 && Math.abs(da) < 0.05) return "Holding Steady";
        if (dv > 0.1 && da < 0) return "Trending towards Calm";
        if (dv > 0.1 && da > 0) return "Trending towards Energized";
        if (dv < -0.1 && da > 0) return "Trending towards Activated";
        if (dv < -0.1 && da < 0) return "Trending towards Tender";
        if (dv > 0.05) return "Mood Brightening";
        if (dv < -0.05) return "Mood Softening";
        if (da > 0.05) return "Energy Rising";
        if (da < -0.05) return "Energy Settling";
        return "Holding Steady";
      }

      function milestonesMarkup(streak) {
        const badges = [
          { days: 3, label: "3-Day Flow", emoji: "🌊" },
          { days: 7, label: "7-Day Zen", emoji: "🧘" },
          { days: 30, label: "30-Day Master", emoji: "🌟" },
        ];
        return badges.map((badge) => {
          const unlocked = streak >= badge.days;
          return `<span class="milestone-badge ${unlocked ? "unlocked" : ""}" title="${unlocked ? "Unlocked!" : `Complete ${badge.days} days to unlock`}">${badge.emoji} ${badge.label}</span>`;
        }).join("");
      }

      function exportData(sessions) {
        const headers = ["date", "valence", "arousal", "emotion", "wordCount", "journal"];
        const csvRows = [
          headers.join(","),
          ...sessions.map((s) =>
            headers.map((h) => {
              const val = s[h] === undefined ? "" : String(s[h]);
              return `"${val.replace(/"/g, '""')}"`;
            }).join(",")
          ),
        ];
        const blob = new Blob([csvRows.join("\n")], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "equilibrium_data.csv";
        a.click();
        URL.revokeObjectURL(url);
      }

      function resultsMarkup() {
        const streak = calculateStreak(state.sessions);
        const drift = calculateDriftVector(state.sessions);
        return `
          <section class="phase results-phase">
            <div class="results-layout">
              <div class="results-copy">
                <h1 class="results-title">Great session. You showed up for yourself.</h1>
                <div class="streak-counter">&#128293; ${streak}-day streak</div>
                <div class="milestone-row">${milestonesMarkup(streak)}</div>
                ${drift ? `<div class="drift-vector-label">&#8599; ${escapeHtml(drift)}</div>` : ""}
              </div>
              <div class="chart-shell" id="chartShell">${scatterPlotMarkup(state.sessions.slice(-7))}</div>
            </div>
            <div class="results-intel-grid">
              <section class="intel-panel">
                <h2 class="intel-title">30-Day Mood Heatmap</h2>
                ${heatmapMarkup(state.sessions)}
              </section>
              <section class="intel-panel">
                <h2 class="intel-title">Journal Word Cloud</h2>
                ${wordCloudMarkup(state.sessions)}
              </section>
            </div>
            <div class="result-actions">
              <button class="secondary-button" type="button" data-action="print">Print Summary</button>
              <button class="export-button" type="button" data-action="export">&#8595; Export Data</button>
              <button class="primary-button" type="button" data-action="new">Start New Session</button>
            </div>
            ${journalDrawerMarkup()}
          </section>
          <div class="scatter-tooltip" id="scatterTooltip"></div>
        `;
      }

      function scatterPlotMarkup(sessions) {
        const size = 320;
        const padding = 36;
        const innerSize = size - padding * 2;
        const todayKey = toLocalDateKey(new Date());
        const points = sessions.map((session) => {
          const rawValence = Number(session.valence);
          const rawArousal = Number(session.arousal);
          const valence = Number.isFinite(rawValence) ? clamp(rawValence) : 0.5;
          const arousal = Number.isFinite(rawArousal) ? clamp(rawArousal) : 0.5;
          return {
            x: padding + (1 - valence) * innerSize,
            y: padding + (1 - arousal) * innerSize,
            color: session.moodColor || "hsl(200 68% 62%)",
            isToday: toLocalDateKey(session.date) === todayKey,
          };
        });
        const trailPoints = points.map((point) => `${point.x},${point.y}`).join(" ");
        const velocity = points.length > 1 ? points.slice(-2) : null;
        const velocityMarkup = velocity
          ? `
            <line class="velocity-arrow" x1="${velocity[0].x}" y1="${velocity[0].y}" x2="${velocity[1].x}" y2="${velocity[1].y}"></line>
            <circle class="velocity-head" cx="${velocity[1].x}" cy="${velocity[1].y}" r="4"></circle>
          `
          : "";
        const replayMarkup =
          points.length > 1
            ? `<circle class="replay-marker" r="10" style="offset-path: path('M ${points.map((point) => `${point.x} ${point.y}`).join(" L ")}');"></circle>`
            : "";
        const pointMarkup = points
          .map(
            (point, index) => {
              const session = sessions[index];
              const dateStr = session ? formatSessionDate(session.date) : "";
              const snippet = session ? escapeHtml((session.journal || "Quiet session").slice(0, 60)) : "";
              const emotionStr = session ? escapeHtml(session.emotion || "") : "";
              return `
              <g class="scatter-node" style="--i: ${index}">
                ${point.isToday ? `<circle class="today-ring" cx="${point.x}" cy="${point.y}" r="13"></circle>` : ""}
                <circle class="scatter-point" cx="${point.x}" cy="${point.y}" r="7" fill="${point.color}"></circle>
                <circle class="scatter-hit" cx="${point.x}" cy="${point.y}" r="18"
                  data-tip-date="${dateStr}"
                  data-tip-emotion="${emotionStr}"
                  data-tip-journal="${snippet}"></circle>
              </g>
            `;
            },
          )
          .join("");

        return `
          <svg class="scatter-svg" viewBox="0 0 ${size} ${size}" role="img" aria-label="7-day valence arousal scatter plot">
            <rect class="scatter-plane" x="${padding}" y="${padding}" width="${innerSize}" height="${innerSize}" rx="8"></rect>
            <line class="scatter-crosshair" x1="${padding}" x2="${size - padding}" y1="${size / 2}" y2="${size / 2}"></line>
            <line class="scatter-crosshair" x1="${size / 2}" x2="${size / 2}" y1="${padding}" y2="${size - padding}"></line>
            <text class="scatter-label" x="${padding}" y="24">Excited</text>
            <text class="scatter-label" x="${size - padding}" y="24" text-anchor="end">Anxious</text>
            <text class="scatter-label" x="${padding}" y="${size - 12}">Calm</text>
            <text class="scatter-label" x="${size - padding}" y="${size - 12}" text-anchor="end">Down</text>
            ${points.length > 1 ? `<polyline class="drift-trail" points="${trailPoints}"></polyline>` : ""}
            ${velocityMarkup}
            ${pointMarkup}
            ${replayMarkup}
          </svg>
        `;
      }

      function heatmapMarkup(sessions) {
        const sessionsByDay = new Map();
        sessions.forEach((session) => {
          const key = toLocalDateKey(session.date);
          if (key) sessionsByDay.set(key, session);
        });

        const cells = [];
        const cursor = new Date();
        cursor.setDate(cursor.getDate() - 29);

        for (let index = 0; index < 30; index += 1) {
          const key = toLocalDateKey(cursor);
          const session = sessionsByDay.get(key);
          cells.push(
            `<span class="heatmap-cell" title="${key}" style="${session ? `background:${session.moodColor}; box-shadow:0 0 16px ${session.moodColor};` : ""}"></span>`,
          );
          cursor.setDate(cursor.getDate() + 1);
        }

        return `<div class="heatmap-grid" aria-label="30-day mood heatmap">${cells.join("")}</div>`;
      }

      function wordCloudMarkup(sessions) {
        const stopWords = new Set(["the", "and", "for", "with", "this", "that", "was", "are", "but", "you", "your", "about", "from", "have", "feel"]);
        const counts = new Map();
        sessions.forEach((session) => {
          String(session.journal || "")
            .toLowerCase()
            .match(/[a-z]{3,}/g)
            ?.forEach((word) => {
              if (!stopWords.has(word)) counts.set(word, (counts.get(word) || 0) + 1);
            });
        });
        const words = [...counts.entries()]
          .sort((a, b) => b[1] - a[1])
          .slice(0, 8);

        if (!words.length) {
          return '<p class="empty-entries">Complete a few reflections to grow your word cloud.</p>';
        }

        const placements = [
          [12, 36],
          [118, 52],
          [222, 34],
          [62, 84],
          [176, 88],
          [250, 76],
          [20, 64],
          [140, 24],
        ];
        const text = words
          .map(([word, count], index) => {
            const [x, y] = placements[index];
            const size = 13 + count * 4;
            return `<text x="${x}" y="${y}" font-size="${size}">${escapeHtml(word)}</text>`;
          })
          .join("");

        return `<svg class="word-cloud" viewBox="0 0 320 100" role="img" aria-label="Word cloud from past journals">${text}</svg>`;
      }

      function journalDrawerMarkup() {
        const entries = state.sessions
          .slice()
          .reverse()
          .filter((session) => session.journal || session.wordCount)
          .slice(0, 7);
        const entriesMarkup = entries.length
          ? entries
              .map(
                (entry) => `
                  <article class="journal-entry" style="border-left-color: ${entry.moodColor || "hsl(200 68% 62%)"}">
                    <div class="entry-meta">${formatSessionDate(entry.date)} &middot; ${entry.wordCount || 0} words</div>
                    <p>${escapeHtml(entry.journal || "Quiet session")}</p>
                  </article>
                `,
              )
              .join("")
          : '<p class="empty-entries">No reflections yet.</p>';

        return `
          <div class="drawer-wrap">
            <button class="drawer-toggle" type="button" data-action="drawer" aria-expanded="${state.drawerOpen}">
              <span>Past Reflections</span>
              <span aria-hidden="true">${state.drawerOpen ? "&minus;" : "+"}</span>
            </button>
            <div class="journal-drawer ${state.drawerOpen ? "is-open" : ""}">${entriesMarkup}</div>
          </div>
        `;
      }

      function scheduleTimedPhase() {
        const phase = phaseScheduler.get(state.currentPhase);
        if (!phase || !phase.duration) return;

        phaseTimer = window.setTimeout(() => {
          advancePhase();
        }, phase.duration);

        if (state.currentPhase === "BREATHING") {
          updateBreathing();
          breathTimer = window.setInterval(updateBreathing, 250);
        }
      }

      function getBreathLabel(elapsed) {
        const cycleDuration = breathConfig.inhale + breathConfig.hold + breathConfig.exhale;
        const cycleSecond = (elapsed / 1000) % cycleDuration;
        if (cycleSecond >= breathConfig.inhale + breathConfig.hold) return "Exhale";
        if (cycleSecond >= breathConfig.inhale) return "Hold";
        return "Inhale";
      }

      function updateBreathing() {
        const totalDuration = phaseScheduler.get("BREATHING").duration;
        const elapsed = Math.min(Math.max(Date.now() - state.phaseStartedAt, 0), totalDuration);
        const remaining = totalDuration - elapsed;
        const ratio = clamp(remaining / totalDuration);
        const label = getBreathLabel(elapsed);
        const progress = site.querySelector("[data-progress]");
        const timer = site.querySelector("[data-breath-timer]");
        const labelNode = site.querySelector("[data-breath-label]");
        const soundStatus = site.querySelector("[data-sound-status]");

        if (progress) progress.setAttribute("stroke-dashoffset", String(progressCircumference * (1 - ratio)));
        if (timer) {
          timer.textContent = formatClock(remaining);
          timer.setAttribute("aria-label", `${formatClock(remaining)} remaining`);
        }
        if (soundStatus) soundStatus.textContent = state.audioReady ? "Sound rhythm active" : "Sound rhythm ready";
        if (labelNode && label !== lastBreathLabel) {
          labelNode.textContent = label;
          labelNode.style.animation = "none";
          labelNode.offsetHeight;
          labelNode.style.animation = "";
          lastBreathLabel = label;
          state.currentBreathTone = label;
          setBreathTone(label);
          pulseHaptics(label);
        }
      }

      function wireCurrentPhase() {
        const phase = state.currentPhase;
        if (phase === "IDLE") wireIdle();
        if (phase === "BREATHING") wireBreathing();
        if (phase === "MOOD") wireMood();
        if (phase === "JOURNAL") wireJournal();
        if (phase === "RESULTS") wireResults();
      }

      function wireIdle() {
        site.querySelector('[data-action="begin"]').addEventListener("click", () => {
          beginAudio();
          state.mood = createDefaultMood();
          state.journal = "";
          state.drawerOpen = false;
          setPhase("BREATHING");
        });
      }

      function wireBreathing() {
        site.querySelector('[data-action="skip"]').addEventListener("click", advancePhase);
      }

      function wireMood() {
        const grid = site.querySelector("[data-mood-grid]");
        const marker = site.querySelector("[data-mood-marker]");
        const capture = site.querySelector('[data-action="capture"]');
        let dragging = false;

        function applyMood(mood) {
          state.mood = mood;
          applyAdaptiveTheme(mood);
          document.body.style.background = moodBodyBackground(mood);
          marker.style.left = `${mood.markerX * 100}%`;
          marker.style.top = `${mood.markerY * 100}%`;
          marker.setAttribute("aria-label", `Valence ${mood.valence.toFixed(2)}, arousal ${mood.arousal.toFixed(2)}`);
          site.querySelector("[data-mood-readout]").textContent =
            `Valence: ${mood.valence.toFixed(2)} \u00B7 Arousal: ${mood.arousal.toFixed(2)}`;
          site.querySelector("[data-mood-swatch]").style.background = mood.moodColor;
          site.querySelector("[data-emotion-label]").textContent = emotionFromMood(mood);
          site.querySelector("[data-capture-slot]").dataset.visible = mood.moved ? "true" : "false";
        }

        function updateFromPointer(event) {
          const bounds = grid.getBoundingClientRect();
          const markerX = clamp((event.clientX - bounds.left) / bounds.width);
          const markerY = clamp((event.clientY - bounds.top) / bounds.height);
          applyMood(createMoodFromPosition(markerX, markerY, true));
        }

        applyMood(state.mood);

        grid.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          grid.setPointerCapture?.(event.pointerId);
          dragging = true;
          updateFromPointer(event);
        });

        grid.addEventListener("pointermove", (event) => {
          if (dragging) updateFromPointer(event);
        });

        function endDrag() {
          dragging = false;
          if ("vibrate" in navigator) navigator.vibrate([30, 50, 30]);
        }

        grid.addEventListener("pointerup", endDrag);
        grid.addEventListener("pointercancel", endDrag);
        marker.addEventListener("keydown", (event) => {
          const step = event.shiftKey ? 0.08 : 0.03;
          let nextX = state.mood.markerX;
          let nextY = state.mood.markerY;

          if (event.key === "ArrowLeft") nextX -= step;
          if (event.key === "ArrowRight") nextX += step;
          if (event.key === "ArrowUp") nextY -= step;
          if (event.key === "ArrowDown") nextY += step;
          if (event.key === "Enter" && state.mood.moved) {
            advancePhase();
            return;
          }

          if (nextX !== state.mood.markerX || nextY !== state.mood.markerY) {
            event.preventDefault();
            applyMood(createMoodFromPosition(nextX, nextY, true));
          }
        });
        capture.addEventListener("click", advancePhase);
      }

      function wireJournal() {
        const textarea = site.querySelector("[data-journal]");
        const counter = site.querySelector("[data-counter]");
        const field = site.querySelector(".journal-field");
        const sentiment = site.querySelector("[data-sentiment]");
        textarea.focus();
        textarea.setSelectionRange(textarea.value.length, textarea.value.length);

        function applySentiment() {
          const score = scoreSentiment(state.journal);
          sentiment.textContent = sentimentLabel(score);
          field.classList.toggle("sentiment-positive", score > 0);
          field.classList.toggle("sentiment-negative", score < 0);
        }

        applySentiment();
        textarea.addEventListener("input", () => {
          state.journal = textarea.value;
          counter.textContent = `${state.journal.length} / 280`;
          counter.classList.toggle("near-limit", state.journal.length > 240);
          applySentiment();
        });

        site.querySelector('[data-action="complete"]').addEventListener("click", () => {
          const entry = {
            date: new Date().toISOString(),
            valence: state.mood.valence,
            arousal: state.mood.arousal,
            moodColor: state.mood.moodColor,
            emotion: emotionFromMood(state.mood),
            wordCount: countWords(state.journal),
            journal: state.journal.trim().slice(0, 100),
          };
          const updatedSessions = [...loadSessions(), entry];
          persistSessions(updatedSessions);
          state.sessions = updatedSessions;
          setPhase("RESULTS");
        });
      }

      function wireResults() {
        site.querySelector('[data-action="print"]').addEventListener("click", () => window.print());
        site.querySelector('[data-action="new"]').addEventListener("click", () => {
          state.mood = createDefaultMood();
          state.journal = "";
          state.drawerOpen = false;
          setPhase("IDLE");
        });
        site.querySelector('[data-action="drawer"]').addEventListener("click", () => {
          state.drawerOpen = !state.drawerOpen;
          render();
        });

        // Export button
        const exportBtn = site.querySelector('[data-action="export"]');
        if (exportBtn) {
          exportBtn.addEventListener("click", () => exportData(state.sessions));
        }

        // Interactive scatter plot tooltips
        const tooltip = document.getElementById("scatterTooltip");
        const chartShell = document.getElementById("chartShell");
        if (tooltip && chartShell) {
          chartShell.addEventListener("mousemove", (e) => {
            const hit = e.target.closest(".scatter-hit");
            if (!hit) return;
            const date = hit.dataset.tipDate;
            const emotion = hit.dataset.tipEmotion;
            const journal = hit.dataset.tipJournal;
            tooltip.innerHTML = `<div style="color:rgba(247,250,255,0.5);margin-bottom:3px;">${date}${emotion ? " · " + emotion : ""}</div>${journal || "Quiet session"}`;
            tooltip.classList.add("is-visible");
            const x = Math.min(e.clientX + 14, window.innerWidth - 200);
            const y = Math.max(e.clientY - 60, 8);
            tooltip.style.left = x + "px";
            tooltip.style.top = y + "px";
          });
          chartShell.addEventListener("mouseleave", () => {
            tooltip.classList.remove("is-visible");
          });
          chartShell.addEventListener("mouseout", (e) => {
            if (!e.target.closest(".scatter-hit")) tooltip.classList.remove("is-visible");
          });
        }
      }

      window.addEventListener("pointermove", (event) => {
        state.cursor.x = event.clientX;
        state.cursor.y = event.clientY;
        const tiltX = ((event.clientX / window.innerWidth) - 0.5) * 18;
        const tiltY = ((event.clientY / window.innerHeight) - 0.5) * -14;
        document.documentElement.style.setProperty("--scene-tilt-x", `${tiltX}deg`);
        document.documentElement.style.setProperty("--scene-tilt-y", `${tiltY}deg`);
      });

      window.addEventListener("resize", () => {
        state.cursor.x = window.innerWidth / 2;
        state.cursor.y = window.innerHeight / 2;
      });

      // ── Particle System ──────────────────────────────────────────────────────
      let particleAnimId = null;
      let particles = [];

      function initParticleSystem() {
        if (particleAnimId) {
          cancelAnimationFrame(particleAnimId);
          particleAnimId = null;
        }
        const canvas = document.getElementById("particleCanvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");

        function resize() {
          canvas.width = canvas.offsetWidth;
          canvas.height = canvas.offsetHeight;
        }
        resize();

        const COUNT = 72;
        particles = Array.from({ length: COUNT }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: 0.8 + Math.random() * 2.2,
          vx: (Math.random() - 0.5) * 0.28,
          vy: (Math.random() - 0.5) * 0.28,
          alpha: 0.12 + Math.random() * 0.28,
          phase: Math.random() * Math.PI * 2,
          speed: 0.008 + Math.random() * 0.012,
        }));

        function getBreathScale() {
          if (state.currentPhase !== "BREATHING") return 1;
          const cycle = (breathConfig.inhale + breathConfig.hold + breathConfig.exhale) * 1000;
          const elapsed = Date.now() - state.phaseStartedAt;
          const t = (elapsed % cycle) / cycle;
          // inhale: expand, hold: stay, exhale: contract
          const inhaleRatio = breathConfig.inhale / (breathConfig.inhale + breathConfig.hold + breathConfig.exhale);
          const holdRatio = breathConfig.hold / (breathConfig.inhale + breathConfig.hold + breathConfig.exhale);
          if (t < inhaleRatio) return 1 + (t / inhaleRatio) * 0.42;
          if (t < inhaleRatio + holdRatio) return 1.42;
          return 1.42 - ((t - inhaleRatio - holdRatio) / (1 - inhaleRatio - holdRatio)) * 0.42;
        }

        function tick() {
          resize();
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const breathScale = getBreathScale();
          const cx = canvas.width / 2;
          const cy = canvas.height / 2;
          const hue = (() => {
            const m = /hsl\((\d+)/.exec(state.mood.moodColor);
            return m ? Number(m[1]) : 200;
          })();

          particles.forEach((p) => {
            p.phase += p.speed;
            const dx = p.x - cx;
            const dy = p.y - cy;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            const breathForce = (breathScale - 1) * 0.18;
            p.x += p.vx + (dx / dist) * breathForce;
            p.y += p.vy + (dy / dist) * breathForce;

            if (p.x < 0) p.x = canvas.width;
            if (p.x > canvas.width) p.x = 0;
            if (p.y < 0) p.y = canvas.height;
            if (p.y > canvas.height) p.y = 0;

            const alpha = p.alpha * (0.7 + 0.3 * Math.sin(p.phase));
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * breathScale, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${hue}, 72%, 72%, ${alpha})`;
            ctx.fill();
          });

          particleAnimId = requestAnimationFrame(tick);
        }

        tick();
      }

      animateCursorAura();
      render();
    </script>
  </body>
</html>
